workspace: /home/richard/repos/total-recall

paths:
  workspace: /home/richard/repos/total-recall
  memory_dir: /home/richard/repos/total-recall/memory
  events_bus: /home/richard/repos/total-recall/memory/events/bus.jsonl
  sensor_state_dir: /home/richard/repos/total-recall/memory/sensor-state
  rumination_dir: /home/richard/repos/total-recall/memory/rumination
  followups_file: /home/richard/repos/total-recall/memory/rumination/follow-ups.jsonl
  observations_file: /home/richard/repos/total-recall/memory/observations.md
  preconscious_buffer: /home/richard/repos/total-recall/memory/preconscious-buffer.md
  logs_dir: /home/richard/repos/total-recall/logs
  health_data_dir: /home/richard/repos/total-recall/health/data
  env_file: /home/richard/repos/total-recall/.env
  perplexity_search_script: ""
  openclaw_config: ~/.openclaw/openclaw.json

profile:
  assistant_name: DevClaw
  primary_user_name: Richard
  household_context: Richard's household
  family_labels: []
  timezone: America/Los_Angeles
  location_label: "Pacific Northwest"

api:
  http_referer: https://github.com/rjmurillo-bot/total-recall

# Models: Using GitHub Copilot proxy (free tokens)
# These are the model IDs as Copilot's API expects them
models:
  rumination: claude-haiku-4.5
  classification: claude-haiku-4.5
  enrichment: claude-haiku-4.5
  ambient_actions: claude-haiku-4.5

connectors:
  high_importance_senders: []
  calendar:
    enabled: true
    provider: gog
    account: rjmurillo@gmail.com
    calendar_id: primary
    lookahead_days: 2
    max_events: 50
    keyring_password: ""
  todoist:
    enabled: false
  ionos:
    enabled: false
    account: ionos
    unread_limit: 10
  gmail:
    enabled: true
    provider: gog
    account: rjmurillo@gmail.com
    unread_query: is:unread
    max_messages: 10
    keyring_password: ""
  fitbit:
    enabled: false
    sleep_target_hours: 7.5
    short_sleep_minutes: 360
    great_sleep_minutes: 480
    watch_off_minutes: 180
    watch_uncertain_minutes: 300
    resting_hr_threshold: 65
    weight_target_lbs: 157
    steps_milestone: 10000
  filewatch:
    enabled: true
    watch_files:
      - "{memory_dir}/observations.md"
      - "{memory_dir}/{today}.md"
      - "{memory_dir}/favorites.md"

notifications:
  quiet_hours:
    enabled: true
    timezone: America/Los_Angeles
    start_hour: 22
    end_hour: 7
  telegram:
    enabled: false
    bot_token: ""
    chat_id: ""
  discord:
    enabled: false
    webhook_url: ""
  webhook:
    enabled: false
    url: ""
    headers: {}

thresholds:
  rumination_cooldown_seconds: 1800
  rumination_staleness_seconds: 14400
  sensor_prune_hours: 48
  emergency:
    importance: 0.85
    expires_within_seconds: 14400
    max_alerts_per_day: 2

ambient_actions:
  enabled: true
  max_actions: 5
  action_budget_seconds: 60
  weather_url: https://wttr.in
  places:
    enabled: false
    default_lat: 0.0
    default_lng: 0.0
    default_limit: 3
  tool_settings:
    calendar_lookup:
      gog_account: rjmurillo@gmail.com
      gog_keyring_password: ""
    gmail_search:
      gog_account: rjmurillo@gmail.com
      gog_keyring_password: ""
    gmail_read:
      gog_account: rjmurillo@gmail.com
      gog_keyring_password: ""
    ionos_search:
      account: ionos
    fitbit_data:
      enabled: false
    openrouter_balance:
      enabled: false
    web_search:
      enabled: false
      script: ""
    places_lookup:
      enabled: false
